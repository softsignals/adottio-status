    url: https://adottio.it
  - name: Piattaforma
    # /healthz also checks the database connection
    url: https://app.adottio.it/healthz
  - name: Ricerca animali
    url: https://app.adottio.it/api/v1/animals
  - name: Amministrazione
    url: https://dashboard.adottio.it/admin

status-website:
  cname: status.adottio.it
